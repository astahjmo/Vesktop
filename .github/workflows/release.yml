name: Release

# Gera os instaladores de Linux, Windows e macOS ao empurrar uma tag `v*` e os
# anexa a um Release em RASCUNHO. O auto update só enxerga o Release depois que
# você o publica na página de Releases.
on:
    push:
        tags:
            - v*
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false # uma plataforma quebrada não cancela as outras
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
                include:
                    - os: macos-latest
                      platform: mac
                    - os: ubuntu-latest
                      platform: linux
                    - os: windows-latest
                      platform: windows

        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: "pnpm"

            # `bsdtar` é exigido pelo alvo pacman (pacote nativo do Arch).
            - name: Install Linux packaging tools
              if: ${{ matrix.platform == 'linux' }}
              run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Run Electron Builder
              run: pnpm electron-builder --${{ matrix.platform }} --publish always
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # macOS sem certificado Apple: não procurar identidade nem notarizar.
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
